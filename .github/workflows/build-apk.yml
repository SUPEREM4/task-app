name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: |
          npx cap add android
          npx cap sync android
      - run: |
          F=android/app/src/main/AndroidManifest.xml
          A='android.permission'
          P1="<uses-permission android:name=\"$A.POST_NOTIFICATIONS\"/>"
          P2="<uses-permission android:name=\"$A.SCHEDULE_EXACT_ALARM\"/>"
          sed -i "s#</manifest>#$P1$P2</manifest>#" $F
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
