name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Make sharp icons
        run: |
          python3 -m pip install --break-system-packages pillow numpy scipy
          python3 make_assets.py
      - name: Firebase project id
        run: |
          PID=$(jq -r .project_info.project_id firebase/google-services.json)
          sed -i "s/__FIREBASE_PROJECT__/$PID/g" www/index.html
      - run: |
          npx cap add android
          npx cap sync android
          npx @capacitor/assets generate --android
      - name: Firebase and Google sign-in
        run: |
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
          fi
          sed -i 's|^ext {|ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = "1.3.0"|' android/variables.gradle
      - run: |
          F=android/app/src/main/AndroidManifest.xml
          A='android.permission'
          P1="<uses-permission android:name=\"$A.POST_NOTIFICATIONS\"/>"
          P2="<uses-permission android:name=\"$A.SCHEDULE_EXACT_ALARM\"/>"
          P3="<uses-permission android:name=\"$A.USE_EXACT_ALARM\"/>"
          sed -i "s#</manifest>#$P1$P2$P3</manifest>#" $F
          D=android/app/src/main/res/drawable
          mkdir -p $D
          cp notif/ic_stat_supreme.png $D/ic_stat_supreme.png
          cp notif/ic_large_supreme.png $D/ic_large_supreme.png
          cp notif/splash_icon.png $D/splash_icon.png
          S=android/app/src/main/res/values/styles.xml
          sed -i '/AppTheme.NoActionBarLaunch/a\        <item name="windowSplashScreenBackground">#000000</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>' $S
      - name: Fixed signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          PW: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/supreme.p12
            cat >> android/app/build.gradle << GRADLE_EOF
          android {
            signingConfigs { supreme { storeFile file("../supreme.p12"); storePassword "$PW"; keyAlias "supreme"; keyPassword "$PW"; storeType "pkcs12" } }
            buildTypes { debug { signingConfig signingConfigs.supreme } }
          }
          GRADLE_EOF
          fi
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
